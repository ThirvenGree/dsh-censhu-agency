name: Plugin checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/checkout@v4
        with:
          repository: ThirvenGree/dsh-cen-shu-life
          ref: 035b1814265d773b2fd5bd32e69d900292b52346
          path: .life
      - uses: actions/checkout@v4
        with:
          repository: ThirvenGree/dsh-censhu-inner-life
          ref: 14fb2fc1a00425935877a386a3f0a16f2d81a88a
          path: .inner
      - run: npm install --prefix .life --ignore-scripts --no-audit --no-fund
      - run: node --check client.js && node --check host.js && node --test agency.test.js integration.test.js inner-agency.test.js control.test.js timeline.test.js focus-review.test.js
        env:
          LIFE_PLUGIN_ROOT: .life
          INNER_PLUGIN_ROOT: .inner

