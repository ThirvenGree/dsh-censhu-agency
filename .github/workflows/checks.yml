name: Plugin checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/checkout@v4
        with:
          repository: ThirvenGree/dsh-cen-shu-life
          ref: 80b239bf55bbd215a55f9111a8e6c8ac6767033f
          path: .life
      - uses: actions/checkout@v4
        with:
          repository: ThirvenGree/dsh-censhu-inner-life
          ref: ad88763e7c86d06c17471a70cd853a6e586f898f
          path: .inner
      - run: npm ci --prefix .life --ignore-scripts --no-audit --no-fund
      - run: node --check client.js && node --check host.js && node --test agency.test.js integration.test.js inner-agency.test.js control.test.js timeline.test.js focus-review.test.js
        env:
          LIFE_PLUGIN_ROOT: .life
          INNER_PLUGIN_ROOT: .inner

