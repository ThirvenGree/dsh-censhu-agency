name: Plugin checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/checkout@v4
        with:
          repository: ThirvenGree/dsh-cen-shu-life
          ref: b687c6b7acca02f5d4408c8c5069a4840c58b3b7
          path: .life
      - uses: actions/checkout@v4
        with:
          repository: ThirvenGree/dsh-censhu-inner-life
          ref: 1d285a16d929bec5052d3005afeafe8ebcd9d7e7
          path: .inner
      - run: npm ci --prefix .life --ignore-scripts --no-audit --no-fund
      - run: node --check client.js && node --check host.js && node --test agency.test.js integration.test.js inner-agency.test.js control.test.js timeline.test.js focus-review.test.js request-history.test.js request-projection.test.js host-request-history.test.js request-projection-runtime.test.js
        env:
          LIFE_PLUGIN_ROOT: .life
          INNER_PLUGIN_ROOT: .inner

