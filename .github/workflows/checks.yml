name: Plugin checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/checkout@v4
        with:
          repository: ThirvenGree/dsh-cen-shu-life
          ref: 6dfbd8da86891e599a25e3221eb586e314e4f162
          path: .life
      - uses: actions/checkout@v4
        with:
          repository: ThirvenGree/dsh-censhu-inner-life
          ref: 6cdd1d6a8bccf7a7e477aaa9ab7bbc4bdab3db16
          path: .inner
      - run: npm install --prefix .life --ignore-scripts --no-audit --no-fund
      - run: node --check client.js && node --check host.js && node --test agency.test.js integration.test.js inner-agency.test.js control.test.js timeline.test.js
        env:
          LIFE_PLUGIN_ROOT: .life
          INNER_PLUGIN_ROOT: .inner

